# Publishes a new Robot Lab Breakout daily challenge every morning and keeps the website up to date.
# Repository Settings > Pages > Source must be set to "GitHub Actions".
name: Daily puzzle and website

on:
  schedule:
    - cron: "5 3 * * *"   # 03:05 UTC = 05:05 South African time (GitHub may start it a little late)
  workflow_dispatch:       # "Run workflow" button for a manual run
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make today's daily challenge (every lock is re-solved and checked)
        run: python3 tools/make_daily.py daily.json
      - name: Record BOLT's Irish voice for the Little Lab and Robot Lab Breakout (only new lines, up to 25 minutes per run)
        continue-on-error: true
        timeout-minutes: 35
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          pip install -q edge-tts
          python3 tools/make_voice.py
      - name: Record the learning app's voice (only new lines, up to 40 minutes per run)
        continue-on-error: true
        timeout-minutes: 50
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          LEARN_VOICE_MINUTES: "40"
        run: |
          pip install -q edge-tts
          python3 tools/make_learn_voice.py
      - name: Save it in the repository
        run: |
          git config user.name "Curiosity Cove robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json junior/voice play/voice learn/voice
          git diff --cached --quiet || (git commit -m "Daily challenge and voice $(TZ=Africa/Johannesburg date +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
