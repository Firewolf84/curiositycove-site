<style>@font-face {
  font-family: "Baloo 2";
  font-weight: 600 700;
  font-style: normal;
  font-display: swap;
  src: url(../play/fonts/Baloo2-700.ttf) format("truetype");
}
@font-face {
  font-family: "Baloo 2";
  font-weight: 800;
  font-style: normal;
  font-display: swap;
  src: url(../play/fonts/Baloo2-800.ttf) format("truetype");
}
@font-face {
  font-family: "Nunito";
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  src: url(../play/fonts/Nunito-400.ttf) format("truetype");
}
@font-face {
  font-family: "Nunito";
  font-weight: 700;
  font-style: normal;
  font-display: swap;
  src: url(../play/fonts/Nunito-700.ttf) format("truetype");
}
@font-face {
  font-family: "Nunito";
  font-weight: 800;
  font-style: normal;
  font-display: swap;
  src: url(../play/fonts/Nunito-800.ttf) format("truetype");
}
:root {
  --ink:#1d1a2e;
  --bg:#fff8ee;
  --card:#ffffff;
  --soft:#6a6480;
  --orange:#ff7a1a;
  --yellow:#ffd23f;
  --blue:#2f5bea;
  --sky:#4fc3ff;
  --lime:#7ccf3f;
  --pink:#ff5ca8;
  --purple:#9b5cff;
  --band:#ff7a1a;
}
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    700 20px/1.35 "Nunito",
    system-ui,
    -apple-system,
    sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  min-height: 100vh;
}
h1,
h2,
h3,
.big {
  font-family:
    "Baloo 2",
    "Nunito",
    system-ui,
    sans-serif;
  font-weight: 800;
  line-height: 1.1;
  margin: 0;
}
button {
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  border: 3px solid var(--ink);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 5px 0 var(--ink);
  min-height: 60px;
  min-width: 60px;
  padding: 6px 14px;
  transition: transform .1s;
}
button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 var(--ink);
}
button[disabled] {
  opacity: .45;
  cursor: default;
}
.bar {
  position: -webkit-sticky;
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
  background: var(--band);
  background-image: radial-gradient(rgba(255, 255, 255, .18) 2px, transparent 2.5px);
  background-size: 22px 22px;
  border-bottom: 4px solid var(--ink);
}
.bar button {
  min-height: 52px;
  padding: 4px 12px;
  font-size: 18px;
  box-shadow: 0 4px 0 var(--ink);
}
.bar .stars {
  margin-left: auto;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 16px;
  padding: 8px 12px;
  font-family: "Baloo 2", sans-serif;
  font-size: 20px;
  white-space: nowrap;
}
main {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px max(14px, env(safe-area-inset-left)) 60px;
}
.hero {
  display: flex;
  gap: 16px;
  align-items: center;
  margin: 4px 0 18px;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 52px);
}
.hero p {
  margin: 4px 0 0;
  color: var(--soft);
}
.bolt {
  width: 110px;
  flex: none;
  animation: float 3s ease-in-out infinite;
}
.bolt.hop {
  animation: hop .6s cubic-bezier(.3, 1.6, .5, 1);
}
.bolt.no {
  animation: no .5s ease-in-out;
}
.bolt.dance {
  animation: dance .6s ease-in-out infinite;
}
@keyframes float {
  50% {
    transform: translateY(-7px);
  }
}
@keyframes hop {
  30% {
    transform: translateY(-30px) scale(1.05, .95);
  }
  60% {
    transform: none;
  }
}
@keyframes no {
  25% {
    transform: rotate(-12deg);
  }
  50% {
    transform: rotate(10deg);
  }
  75% {
    transform: rotate(-6deg);
  }
}
@keyframes dance {
  25% {
    transform: rotate(-8deg) translateY(-8px);
  }
  75% {
    transform: rotate(8deg) translateY(-8px);
  }
}
.ages {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}
.age {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 24px 16px;
  border-radius: 28px;
  font-size: 22px;
}
.age .e {
  font-size: 72px;
  line-height: 1;
}
.age b {
  font: 800 34px/1 "Baloo 2", sans-serif;
}
.age small {
  font-weight: 700;
  color: var(--soft);
  font-size: 17px;
}
.island {
  border: 4px solid var(--ink);
  border-radius: 28px;
  overflow: hidden;
  background: var(--card);
  margin-bottom: 18px;
  box-shadow: 0 6px 0 var(--ink);
}
.ihead {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background-image:
    repeating-linear-gradient(
      -45deg,
      rgba(255, 255, 255, .14) 0 12px,
      transparent 12px 24px);
}
.ihead .e {
  font-size: 44px;
  line-height: 1;
  animation: float 2.6s ease-in-out infinite;
}
.ihead h2 {
  font-size: 28px;
}
.ihead span {
  margin-left: auto;
  font: 800 18px "Baloo 2", sans-serif;
  background: rgba(255, 255, 255, .85);
  border-radius: 14px;
  padding: 4px 10px;
}
.lvls {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  padding: 16px;
}
.lv {
  aspect-ratio: 1;
  border-radius: 50%;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font: 800 26px/1 "Baloo 2", sans-serif;
  min-height: 0;
}
.lv i {
  font-style: normal;
  font-size: 12px;
  letter-spacing: -1px;
  color: #d99a00;
  min-height: 13px;
}
.lv.done {
  background: #e9fbdc;
}
.lv.next {
  background: var(--yellow);
  animation: pulse 1.3s ease-in-out infinite;
}
@keyframes pulse {
  50% {
    transform: scale(1.1);
  }
}
.lockmsg {
  padding: 0 16px 14px;
  margin: 0;
  color: var(--soft);
  font-size: 17px;
}
.island.locked .ihead {
  filter: grayscale(.8);
}
.play {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.top {
  display: flex;
  gap: 12px;
  align-items: center;
}
.top .bolt {
  width: 84px;
}
.bubble {
  position: relative;
  flex: 1;
  background: #fff;
  border: 4px solid var(--ink);
  border-radius: 24px;
  padding: 12px 16px;
  font: 800 clamp(22px, 3.6vw, 30px)/1.2 "Baloo 2", sans-serif;
  box-shadow: 0 5px 0 var(--ink);
  display: flex;
  gap: 10px;
  align-items: center;
}
.bubble::before {
  content: "";
  position: absolute;
  left: -16px;
  top: 28px;
  width: 22px;
  height: 22px;
  background: #fff;
  border-left: 4px solid var(--ink);
  border-bottom: 4px solid var(--ink);
  transform: rotate(45deg);
}
.bubble .t {
  flex: 1;
}
.bubble button {
  min-height: 52px;
  min-width: 52px;
  padding: 0;
  font-size: 24px;
  border-radius: 50%;
  flex: none;
}
.dots {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.dots span {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: #fff;
}
.dots span.on {
  background: var(--lime);
}
.dots span.now {
  background: var(--yellow);
  transform: scale(1.2);
}
.stage {
  background: var(--card);
  border: 4px solid var(--ink);
  border-radius: 28px;
  padding: 18px;
  box-shadow: 0 6px 0 var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  min-height: 340px;
}
.show {
  font-size: clamp(34px, 7vw, 56px);
  line-height: 1.15;
  text-align: center;
  word-break: break-word;
}
.show .q {
  display: inline-block;
  min-width: 1.2em;
  border: 4px dashed var(--orange);
  border-radius: 16px;
  color: var(--orange);
  font-family: "Baloo 2", sans-serif;
  padding: 0 8px;
}
.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
}
.choices button {
  min-width: 96px;
  min-height: 96px;
  font-size: 44px;
  border-radius: 24px;
}
.choices button.num {
  font: 800 46px "Baloo 2", sans-serif;
}
.shake {
  animation: shake .45s;
}
@keyframes shake {
  20% {
    transform: translateX(-10px);
  }
  40% {
    transform: translateX(10px);
  }
  60% {
    transform: translateX(-6px);
  }
  80% {
    transform: translateX(6px);
  }
}
.good {
  animation: good .5s cubic-bezier(.3, 1.6, .5, 1);
  background: #e9fbdc !important;
}
@keyframes good {
  50% {
    transform: scale(1.18);
  }
}
.grid {
  display: grid;
  gap: 6px;
  width: min(100%, 420px);
}
.cell {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 3px solid var(--ink);
  background: #eef6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(26px, 6vw, 44px);
  position: relative;
}
.cell.rock {
  background: #d9d2c4;
}
.cell.trail {
  background: #fff2b8;
}
.prog {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  min-height: 62px;
  padding: 6px;
  border: 3px dashed var(--soft);
  border-radius: 18px;
  width: min(100%, 560px);
}
.prog span {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 3px solid var(--ink);
  background: var(--yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
.prog span.empty {
  background: transparent;
  border-style: dotted;
  border-color: var(--soft);
}
.prog span.run {
  background: var(--lime);
  transform: scale(1.15);
}
.pads {
  display: grid;
  grid-template-columns: repeat(3, 76px);
  grid-template-rows: repeat(2, 76px);
  gap: 10px;
  justify-content: center;
}
.pads button {
  font-size: 38px;
  padding: 0;
  border-radius: 22px;
  background: #e3eaff;
}
.pads .up {
  grid-column: 2;
}
.pads .left {
  grid-column: 1;
  grid-row: 2;
}
.pads .down {
  grid-column: 2;
  grid-row: 2;
}
.pads .right {
  grid-column: 3;
  grid-row: 2;
}
.acts {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.go {
  background: var(--lime);
  font: 800 28px "Baloo 2", sans-serif;
  padding: 6px 26px;
}
.debugprog button {
  width: 64px;
  height: 64px;
  font-size: 34px;
  padding: 0;
  background: var(--yellow);
}
.copywrap {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}
.copywrap .label {
  font: 800 18px "Baloo 2", sans-serif;
  text-align: center;
  margin-bottom: 4px;
}
.tgrid {
  display: grid;
  gap: 4px;
}
.tgrid span {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 2px solid var(--ink);
  background: #fff;
}
.pgrid {
  display: grid;
  gap: 6px;
}
.pgrid button {
  width: 64px;
  height: 64px;
  min-height: 0;
  min-width: 0;
  padding: 0;
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--ink);
  background: #fff;
}
.mem {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(4, minmax(64px, 96px));
}
.mem button {
  aspect-ratio: 3/4;
  min-height: 0;
  padding: 0;
  font-size: 44px;
  background: var(--blue);
  color: transparent;
  border-radius: 18px;
  transition: transform .25s, background .25s;
}
.mem button.up {
  background: #fff;
  color: var(--ink);
  animation: flipin .25s;
}
@keyframes flipin {
  from {
    transform: scaleX(.1);
  }
}
.mem button.got {
  background: #e9fbdc;
  color: var(--ink);
  opacity: .85;
}
.order button {
  font-size: 44px;
}
.order button .n {
  position: absolute;
  top: -10px;
  right: -10px;
  background: var(--lime);
  border: 3px solid var(--ink);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font: 800 18px/28px "Baloo 2", sans-serif;
  color: var(--ink);
}
.order button {
  position: relative;
}
.cards {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.card {
  width: 96px;
  height: 130px;
  border-radius: 16px;
  border: 4px solid var(--ink);
  background: #d8d4e6;
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
}
.card i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #9a93b3;
}
.card.on {
  background: var(--yellow);
}
.card.on i {
  background: var(--ink);
}
.rows {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(100%, 600px);
}
.rows button {
  font-size: 34px;
  letter-spacing: 4px;
  text-align: left;
  padding: 8px 16px;
}
.repeat {
  display: flex;
  align-items: center;
  gap: 10px;
  font: 800 28px "Baloo 2", sans-serif;
  background: #e3eaff;
  border: 4px solid var(--ink);
  border-radius: 20px;
  padding: 8px 16px;
}
.repeat .u {
  font-size: 40px;
  background: #fff;
  border-radius: 14px;
  border: 3px dashed var(--ink);
  padding: 0 10px;
}
.reward {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding-top: 20px;
}
.gift {
  font-size: 140px;
  background: none;
  border: none;
  box-shadow: none;
  animation: wiggle 1.2s ease-in-out infinite;
  min-height: 0;
}
@keyframes wiggle {
  0%, 60%, 100% {
    transform: none;
  }
  70% {
    transform: rotate(-10deg) scale(1.05);
  }
  80% {
    transform: rotate(10deg) scale(1.05);
  }
  90% {
    transform: rotate(-6deg);
  }
}
.sticker {
  font-size: 150px;
  line-height: 1;
  animation: pop .7s cubic-bezier(.3, 1.6, .5, 1);
}
@keyframes pop {
  from {
    transform: scale(0) rotate(-180deg);
  }
}
.rstars {
  font-size: 58px;
  letter-spacing: 6px;
}
.rstars span {
  display: inline-block;
  animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both;
}
.rstars span.off {
  filter: grayscale(1);
  opacity: .35;
}
.book {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 12px;
}
.slot {
  aspect-ratio: 1;
  border-radius: 22px;
  border: 3px dashed #c9c3dc;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  background: #fff;
}
.slot.got {
  border: 3px solid var(--ink);
  background: #fffbe6;
  box-shadow: 0 4px 0 var(--ink);
}
.slot.no {
  color: #c9c3dc;
  font-size: 30px;
}
.grown {
  margin-top: 26px;
  text-align: center;
}
.grown button {
  min-height: 48px;
  font-size: 16px;
  box-shadow: 0 3px 0 var(--ink);
}
.gbox {
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 20px;
  padding: 16px;
  margin-top: 12px;
  text-align: left;
  font-weight: 700;
  font-size: 18px;
}
.gbox input {
  font: 800 26px "Baloo 2", sans-serif;
  width: 120px;
  min-height: 56px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  text-align: center;
}
.foot {
  color: var(--soft);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  margin-top: 30px;
}
.foot a {
  color: var(--blue);
}
.floattxt {
  position: fixed;
  z-index: 9;
  left: 50%;
  top: 40%;
  transform: translateX(-50%);
  font: 800 54px/1 "Baloo 2", sans-serif;
  color: var(--yellow);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke;
  pointer-events: none;
  animation: rise 1.3s ease-out forwards;
  white-space: nowrap;
}
@keyframes rise {
  0% {
    transform: translate(-50%, 20px) scale(.5);
    opacity: 0;
  }
  25% {
    transform: translate(-50%, 0) scale(1.15);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -80px) scale(1);
    opacity: 0;
  }
}
@media (max-width: 560px) {
  body {
    font-size: 18px;
  }
  .choices button {
    min-width: 82px;
    min-height: 82px;
    font-size: 38px;
  }
  .pads {
    grid-template-columns: repeat(3, 68px);
    grid-template-rows: repeat(2, 68px);
  }
  .pgrid button {
    width: 54px;
    height: 54px;
  }
  .mem {
    grid-template-columns: repeat(4, minmax(54px, 80px));
  }
  .top .bolt {
    width: 64px;
  }
  .lvls {
    gap: 8px;
    padding: 12px;
  }
  .lv {
    font-size: 22px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<header class="bar">
  <button type="button" data-go="map" aria-label="Islands">🏝️</button>
  <button type="button" data-go="book" aria-label="Sticker book">📒</button>
  <button type="button" id="snd" aria-label="Sound on">🔊</button>
  <span class="stars" id="stars">⭐ 0</span>
</header>
<main id="view"></main>
